services:
  ticket-monitor:
    build: .
    container_name: ticket-monitor
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Asia/Shanghai
      # 可选：通过环境变量覆盖配置
      # - TG_BOT_TOKEN=your_bot_token
      # - TG_CHAT_ID=your_chat_id
      # - MONITOR_INTERVAL=60
      # - TARGET_DATES=2025-12-07,2025-12-08
